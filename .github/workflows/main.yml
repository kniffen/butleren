on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Check types
      run: pnpm check-types
    - name: Lint code
      run: pnpm lint
    - name: Run tests
      run: pnpm test
    - name: Build
      run: pnpm build